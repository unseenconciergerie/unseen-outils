name: Veille presse - résumé du matin

# Lance veille_presse.py --resume une fois par jour, le matin.
# 6h UTC = 8h à Paris en été, 7h en hiver.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les bibliothèques
        run: pip install -r radar-unseen/requirements.txt

      - name: Préparer le fichier .env (à partir des secrets GitHub)
        run: |
          echo "TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}" > radar-unseen/.env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> radar-unseen/.env

      - name: Envoyer le résumé du matin
        run: python radar-unseen/veille_presse.py --resume

      - name: Enregistrer la mémoire mise à jour
        run: |
          cd radar-unseen
          git config user.name "Radar UNSEEN."
          git config user.email "actions@github.com"
          git add memoire.json
          git diff --cached --quiet || git commit -m "Mémoire veille presse mise à jour (résumé)"
          git push
